<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Inmobiliaria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

        nav {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 14px 40px; background: #1e1b4b;
        }
        .nav-logo {
            display: flex; align-items: center; gap: 8px;
            color: white; font-size: 18px; font-weight: 600; text-decoration: none;
        }
        .nav-logo-icon {
            width: 30px; height: 30px; background: #6D28D9;
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
        }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a {
            color: rgba(255,255,255,0.8); text-decoration: none;
            padding: 7px 14px; border-radius: 6px; font-size: 14px;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-links .btn-nav {
            background: #6D28D9; color: white; padding: 7px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none;
        }

        .contenedor { flex: 1; display: flex; }

        /* PANEL IZQUIERDO */
        .panel-form {
            flex: 0 0 42%; background: #fff;
            padding: 56px 48px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .logo-form {
            display: flex; align-items: center; gap: 8px; margin-bottom: 36px;
        }
        .logo-form-icon {
            width: 32px; height: 32px; background: #6D28D9;
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
        }
        .logo-form span { font-size: 20px; font-weight: 600; color: #1a1a1a; }

        h1 { font-size: 26px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .subtitulo { font-size: 14px; color: #6b7280; margin-bottom: 28px; }

        .form-group { margin-bottom: 16px; }
        label { font-size: 12px; color: #555; display: block; margin-bottom: 5px; }
        label span { color: #6D28D9; }
        input {
            width: 100%; padding: 11px 14px;
            border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 14px; transition: border-color 0.2s; outline: none;
        }
        input:focus { border-color: #6D28D9; }

        .btn-login {
            width: 100%; padding: 13px;
            background: #6D28D9; color: white;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #5b21b6; }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0; color: #9ca3af; font-size: 13px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #e5e7eb;
        }

        .links-bottom {
            text-align: center; margin-top: 16px;
            font-size: 13px; color: #6b7280;
        }
        .links-bottom a { color: #6D28D9; text-decoration: none; font-weight: 600; }
        .links-bottom a:hover { text-decoration: underline; }

        .alerta-error {
            background: #fee2e2; color: #991b1b;
            padding: 10px 14px; border-radius: 8px;
            margin-bottom: 16px; font-size: 13px;
            border: 1px solid #fca5a5;
        }

        /* PANEL DERECHO — imagen local */
        .panel-img {
            flex: 1; position: relative; overflow: hidden;
        }
        .panel-img img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        /* Overlay oscuro encima de la imagen */
        .panel-img-overlay {
            position: absolute; inset: 0;
            background: rgba(30, 27, 75, 0.45);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px; text-align: center;
        }
        .panel-img-overlay h2 {
            color: white; font-size: 26px;
            font-weight: 600; margin-bottom: 12px; line-height: 1.3;
        }
        .panel-img-overlay p {
            color: rgba(255,255,255,0.8); font-size: 14px;
            line-height: 1.7; max-width: 260px; margin-bottom: 28px;
        }
        .btn-home {
            padding: 12px 28px; background: white;
            color: #6D28D9; border-radius: 8px;
            font-size: 14px; font-weight: 700;
            text-decoration: none; transition: background 0.2s;
        }
        .btn-home:hover { background: #ede9fe; }
    .oculto { display: none !important; }
        select { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="panel-form">
            <div id="seccion-login">
                <h1>Iniciar sesión</h1>
                <p class="subtitulo">Ingresa tus datos para continuar.</p>

                <form action="UsuarioServlet" method="POST">
                    <input type="hidden" name="accion" value="login">
                    <div class="form-group">
                        <label>Correo electrónico <span>*</span></label>
                        <input type="email" name="email" placeholder="usuario@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña <span>*</span></label>
                        <input type="password" name="contrasena" placeholder="Tu contraseña" required>
                    </div>
                    <button type="submit" class="btn-login">Iniciar sesión</button>
                </form>
                <div class="links-bottom">
                    ¿No tienes cuenta? <a href="#" onclick="toggleForms()">Regístrate gratis</a>
                </div>
            </div>

            <div id="seccion-registro" class="oculto">
                <h1>Crear cuenta</h1>
                <p class="subtitulo">Únete a nuestra red inmobiliaria.</p>

                <form action="UsuarioServlet" method="POST">
                    <div style="display:flex; gap:10px">
                        <div class="form-group" style="flex:1">
                            <label>Nombre <span>*</span></label>
                            <input type="text" name="nombre" required>
                        </div>
                        <div class="form-group" style="flex:1">
                            <label>Apellido <span>*</span></label>
                            <input type="text" name="apellido" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Correo electrónico <span>*</span></label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" name="telefono">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuario</label>
                        <select name="tipo_usuario">
                            <option value="comprador">Comprador</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="agente">Agente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contraseña <span>*</span></label>
                        <input type="password" name="contrasena" required>
                    </div>
                    <button type="submit" class="btn-login">Crear cuenta</button>
                </form>
                <div class="links-bottom">
                    ¿Ya tienes cuenta? <a href="#" onclick="toggleForms()">Inicia sesión</a>
                </div>
            </div>
        </div>
        </div>

    <script>
        function toggleForms() {
            document.getElementById('seccion-login').classList.toggle('oculto');
            document.getElementById('seccion-registro').classList.toggle('oculto');
        }
    </script>
</body>
</html>
